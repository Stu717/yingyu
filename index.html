<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>邀请信写作 · 复习手册</title>
<style>
  :root{
    --bg:#f7f6f2; --card:#fff; --ink:#1a1c1b; --muted:#6b6d68;
    --line:#e5e3db; --accent:#0d6e6e; --soft:#e6f2f2;
    --highlight:#fff3c4; --highlight-ink:#8a5a00;
    --star:#f59e0b; --star-gray:#d1d5db;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink); line-height:1.65;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  .wrap{max-width:800px; margin:0 auto; padding:0 20px}
  
  /* 顶部 */
  .hero{padding:40px 0 20px}
  .hero h1{font-size:26px; margin:0 0 8px}
  .hero p{margin:0; color:var(--muted); font-size:14px}
  .hero mark { background: var(--highlight); color: var(--highlight-ink); padding: 2px 6px; border-radius: 4px; border: 1px dashed var(--highlight-ink); font-weight: 600;}
  .hero strong { color: var(--accent); }
  
  /* 工具栏 */
  .toolbar{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 0; border-bottom:1px solid var(--line); margin-bottom:20px;
  }
  .toggle-wrap{display:flex; align-items:center; gap:8px; cursor:pointer; font-size:14px; color:var(--muted)}
  .toggle-wrap input{accent-color:var(--accent); width:16px; height:16px; margin:0}

  /* 步骤卡片 */
  details{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    margin-bottom:12px; overflow:hidden; transition:border-color .2s;
  }
  details[open]{border-color:#b0ccca; box-shadow:0 2px 8px rgba(0,0,0,.02)}
  summary{
    padding:16px 20px; cursor:pointer; list-style:none; display:flex; align-items:center;
    font-weight:600; font-size:16px; user-select:none;
  }
  summary::-webkit-details-marker{display:none}
  summary:before{
    content:'+'; font-size:18px; color:var(--accent); margin-right:12px; font-weight:700;
    transition:transform .2s;
  }
  details[open] summary:before{content:'−'; transform:rotate(180deg)}
  .badge{
    font-size:12px; color:var(--accent); background:var(--soft);
    padding:2px 8px; border-radius:6px; margin-right:12px;
  }
  
  .content{padding:0 20px 20px 20px; border-top:1px solid var(--line); padding-top:16px}
  .note{font-size:13.5px; color:var(--muted); margin:0 0 16px}
  
  /* 句子列表 */
  .item{
    display:flex; gap:12px; padding:10px 12px; border-radius:8px;
    margin-bottom:8px; background:#faf9f6; align-items:flex-start;
    transition:background .15s;
  }
  .item:hover{background:#fff; border:1px solid var(--line); padding:9px 11px}
  
  /* 标黄与加粗逻辑 */
  .en{
    flex:1; font-family:ui-serif,Georgia,"Times New Roman",serif;
    font-size:15.5px; color:#22303a; line-height:2.2; word-break: break-word;
  }
  .en strong { color: var(--accent); font-weight: 700; }
  
  /* 原生下拉框样式定制（黄色背景块） */
  .blank-select {
    background-color: var(--highlight);
    color: var(--highlight-ink);
    border: 1px dashed var(--highlight-ink);
    border-radius: 4px;
    padding: 3px 24px 3px 8px;
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238a5a00' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 6px center;
    background-size: 12px;
    outline: none;
    transition: all .2s;
    vertical-align: middle;
    max-width: 100%;
  }
  .blank-select option { background: #fff; color: var(--ink); font-family: inherit; font-size: 14px;}
  .blank-select:hover { background-color: #ffe89a; border-style: solid; }
  .blank-select:focus { border-style: solid; box-shadow: 0 0 0 3px rgba(255, 232, 154, 0.5); }

  /* 标签与收藏 */
  .tag{
    flex:0 0 auto; font-size:12px; color:var(--muted); background:#eae8e3;
    padding:2px 8px; border-radius:4px; margin-top:6px; white-space:nowrap;
  }
  .star-btn{
    background:none; border:none; cursor:pointer; font-size:20px;
    color:var(--star-gray); padding:0; margin-top:4px; transition:.15s; outline:none;
  }
  .star-btn:hover, .star-btn.active{color:var(--star)}
  
  /* 第8部分素材库 */
  .grid{display:grid; gap:12px; grid-template-columns:1fr; margin-top:10px}
  .type-box{background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px}
  .type-box h3{margin:0 0 10px; font-size:15px; color:var(--accent); display:flex; align-items:center; justify-content:space-between}
  .meta{font-size:13px; color:var(--muted); margin-bottom:8px}
  
  .phrase-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 10px; border-radius:6px; background:#faf9f6; margin-bottom:6px;
  }
  .phrase-item .en{font-size:14.5px; color:var(--accent); font-weight:700; line-height:1.4;}
  .btn-use { font-size: 12px; color: var(--accent); background: transparent; border: 1px solid var(--accent); padding: 2px 8px; border-radius: 6px; cursor: pointer; margin-left: 8px; white-space: nowrap;}
  .btn-use:hover { background: var(--accent); color: #fff;}

  .is-hidden { display:none !important; }
</style>
</head>
<body>

<div class="wrap">
  <div class="hero">
    <h1>邀请信写作 · 复习手册</h1>
    <p>
      <mark>黄色下拉框</mark>为需根据题目替换的词汇；<br>
      <strong>青色加粗</strong>为背诵时要抓住的核心动词搭配。
    </p>
  </div>

  <div class="toolbar">
    <label class="toggle-wrap">
      <input type="checkbox" id="favToggle">
      <span>只看我收藏的句子</span>
    </label>
  </div>

  <div id="stepsContainer"></div>
  
  <div style="margin-top:30px">
    <details>
      <summary><span class="badge">08</span> 分类素材库</summary>
      <div class="content">
        <p class="note">丰富的短语库。点击“套用”可自动填入上方第 3 部分的下拉框中。</p>
        <div class="grid" id="bankGrid"></div>
      </div>
    </details>
  </div>
</div>

<script>
// 准备下拉选项 HTML
const getOptions = (list, placeholder) => {
  let html = `<option value="" disabled selected>${placeholder}</option>`;
  list.forEach(item => {
    html += `<option value="${item}">${item}</option>`;
  });
  return html;
};

const bankSec8 = [
  'exchange ideas with other scholars', 'share your research findings', 'learn about the latest developments in the field', 'meet other experts',
  'offer guidance to young students', 'comment on their performances', 'discover talented students',
  'make new friends', 'meet people with similar interests', 'communicate with our students and teachers',
  'relax and enjoy yourself', 'enjoy wonderful performances', 'spend a pleasant evening with us',
  'share your valuable experience', 'present your ideas', 'show your talent',
  'learn more about our students', 'promote cooperation with our university', 'build closer ties with us'
];

const stepsData = [
  {
    id: 's1', title: '介绍自己',
    note: '根据收信人身份，通过黄色下拉框选择对应句式。',
    items: [
      { tag: '组织者', html: 'I am Li Ming, a student from <select class="blank-select"><option value="" disabled selected>院系</option><option value="the School of Foreign Languages">the School of Foreign Languages</option><option value="the School of Economics">the School of Economics</option></select> and one of the organizers of this activity.' },
      { tag: '邀请老师', html: 'I am Li Ming, a student representative from <select class="blank-select"><option value="" disabled selected>院系</option><option value="the School of Foreign Languages">the School of Foreign Languages</option></select>.' },
      { tag: '负责人', html: 'I am Li Ming, <select class="blank-select"><option value="" disabled selected>职务</option><option value="chairman">chairman</option><option value="president">president</option></select> of <select class="blank-select"><option value="" disabled selected>组织</option><option value="the Student Union">the Student Union</option></select>.' },
      { tag: '示例', html: 'I am Li Ming, chairman of the Student Union.' },
      { tag: '示例', html: 'I am Li Ming, a graduate student from the School of Foreign Languages.' }
    ]
  },
  {
    id: 's2', title: '写信目的 + 活动信息',
    note: '合并句式填空：先选活动类型，再选时间地点。',
    items: [
      { tag: '目的', html: 'It is my great pleasure to <strong>invite you to our annual forum</strong>.' },
      { tag: '目的', html: 'On behalf of the Student Union, I would like to <strong>invite you to deliver a lecture</strong>.' },
      { 
        tag: '合并句', 
        html: '..., an activity themed <select class="blank-select" style="min-width:160px;"><option value="" disabled selected>活动类型</option><option value="an English speech contest">an English speech contest</option><option value="an academic lecture">an academic lecture</option><option value="a cultural exchange activity">a cultural exchange activity</option><option value="a graduation ceremony">a graduation ceremony</option><option value="a campus seminar">a campus seminar</option></select>, which <strong>will be held</strong> <select class="blank-select" style="min-width:200px;"><option value="" disabled selected>时间地点</option><option value="in the school auditorium at 2 p.m. on June 15th">in the school auditorium at 2 p.m. on June 15th</option><option value="in Meeting Room 201 at 3 p.m. next Friday">in Meeting Room 201 at 3 p.m. next Friday</option><option value="in the conference hall on the morning of June 20th">in the conference hall on the morning of June 20th</option></select>.' 
      }
    ]
  },
  {
    id: 's3', title: '活动对收信人的好处',
    note: '青色部分为核心句式骨架，黄色下拉框内填入第 8 部分的动词短语。',
    items: [
      { tag: '好处', html: 'The activity will <strong>provide you with a good opportunity</strong> to <select class="blank-select" style="min-width:180px;">${getOptions(bankSec8, '选择素材')}</select>.' },
      { tag: '好处', html: 'The activity will <strong>enable you</strong> to <select class="blank-select" style="min-width:180px;">${getOptions(bankSec8, '选择素材')}</select>.' },
      { tag: '好处', html: 'The activity will <strong>be a good chance for you</strong> to <select class="blank-select" style="min-width:180px;">${getOptions(bankSec8, '选择素材')}</select>.' },
      { tag: '完整句', html: 'Your participation will <strong>be of great benefit</strong> to our students.' }
    ]
  },
  {
    id: 's4', title: '适度恭维收信人',
    note: '一两句即可，把握核心赞美词。',
    items: [
      { tag: '恭维', html: 'As <strong>an expert in this field</strong>, you are <strong>widely respected by our students</strong>.' },
      { tag: '恭维', html: 'With <strong>your rich experience in this area</strong>, <strong>you would be a most welcome guest</strong>.' },
      { tag: '恭维', html: 'As <strong>a highly respected scholar</strong>, ...' },
      { tag: '恭维', html: '<strong>Your presence would be greatly appreciated</strong>.' }
    ]
  },
  {
    id: 's5', title: '明确请求 + 截止时间',
    note: '具体动作和截止时间均可下拉替换。',
    items: [
      { tag: '完整句', html: '<strong>We would be grateful if you could</strong> <select class="blank-select" style="min-width:180px;"><option value="" disabled selected>动作</option><option value="confirm your attendance">confirm your attendance</option><option value="give a short speech at the activity">give a short speech at the activity</option><option value="prepare a brief introduction to...">prepare a brief introduction to...</option></select> before <select class="blank-select" style="min-width:100px;"><option value="" disabled selected>时间</option><option value="June 10th">June 10th</option><option value="next Friday">next Friday</option></select>.' },
      { tag: '完整句', html: 'Please <strong>let us know whether you can come</strong> by <select class="blank-select" style="min-width:100px;"><option value="" disabled selected>时间</option><option value="June 10th">June 10th</option><option value="next Friday">next Friday</option></select>.' }
    ]
  },
  {
    id: 's6', title: '客套话',
    note: '收尾礼节。',
    items: [
      { tag: '客套', html: 'Should you have any questions, please <strong>do not hesitate to contact me</strong>.' },
      { tag: '客套', html: 'We <strong>look forward to welcoming you</strong> to our university.' },
      { tag: '客套', html: 'Thank you for your time and consideration.' },
      { tag: '客套', html: 'We would appreciate your kind reply.' },
      { tag: '客套', html: 'Thank you in advance for your support.' }
    ]
  },
  {
    id: 's7', title: '期待回复',
    note: '结尾固定收束句。',
    items: [
      { tag: '结尾', html: '<strong>Looking forward to</strong> your reply.' },
      { tag: '结尾', html: 'We <strong>look forward to hearing from you</strong> soon.' }
    ]
  }
];

// 初始化收藏状态
let favorites = JSON.parse(localStorage.getItem('invitation_favs')) || {};

// 渲染步骤（不传入重新渲染逻辑，保持下拉框状态）
function renderSteps() {
  const container = document.getElementById('stepsContainer');
  container.innerHTML = stepsData.map(step => `
    <details ${step.id === 's2' || step.id === 's3' ? 'open' : ''}>
      <summary><span class="badge">${step.id.slice(1)}</span> ${step.title}</summary>
      <div class="content">
        <p class="note">${step.note}</p>
        ${step.items.map((item, idx) => {
          const itemId = `${step.id}_${idx}`;
          const isStarred = favorites[itemId] ? 'active' : '';
          const starChar = favorites[itemId] ? '★' : '☆';
          return `
            <div class="item" id="item-${itemId}">
              <span class="tag">${item.tag}</span>
              <span class="en">${item.html}</span>
              <button class="star-btn ${isStarred}" data-id="${itemId}">${starChar}</button>
            </div>
          `;
        }).join('')}
      </div>
    </details>
  `).join('');
  applyFilter();
}

// 渲染素材库
function renderBank() {
  const grid = document.getElementById('bankGrid');
  const groupedBank = {
    '学术交流类': bankSec8.slice(0, 4),
    '指导点评类': bankSec8.slice(4, 7),
    '社交拓展类': bankSec8.slice(7, 10),
    '放松娱乐类': bankSec8.slice(10, 13),
    '展示分享类': bankSec8.slice(13, 16),
    '了解合作类': bankSec8.slice(16, 19)
  };

  grid.innerHTML = Object.entries(groupedBank).map(([cat, phrases], tIdx) => `
    <div class="type-box">
      <h3>${cat}</h3>
      ${phrases.map((phrase, pIdx) => {
        const itemId = `bank_${tIdx}_${pIdx}`;
        const isStarred = favorites[itemId] ? 'active' : '';
        const starChar = favorites[itemId] ? '★' : '☆';
        return `
          <div class="phrase-item" id="item-${itemId}">
            <div style="flex:1;">
              <span class="en">${phrase}</span>
            </div>
            <div style="display:flex; align-items:center;">
              <button class="btn-use" onclick="useInStep3('${phrase}')">套用</button>
              <button class="star-btn ${isStarred}" data-id="${itemId}">${starChar}</button>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `).join('');
  applyFilter();
}

// 点收藏：只更新图标和状态，不重新渲染整个 DOM（解决折叠问题）
document.addEventListener('click', function(e) {
  const starBtn = e.target.closest('.star-btn');
  if (starBtn) {
    const id = starBtn.dataset.id;
    if (favorites[id]) {
      delete favorites[id];
      starBtn.classList.remove('active');
      starBtn.textContent = '☆';
    } else {
      favorites[id] = true;
      starBtn.classList.add('active');
      starBtn.textContent = '★';
    }
    localStorage.setItem('invitation_favs', JSON.stringify(favorites));
    
    // 如果开启了“只看收藏”，需要重新应用过滤
    if (document.getElementById('favToggle').checked) {
      applyFilter();
    }
  }
});

// 快捷套用到第3部分（修改原生 select 的 value）
window.useInStep3 = function(phrase) {
  // 找到第3部分的第一个下拉框
  const selectEl = document.querySelector('#item-s3_0 .blank-select');
  if (selectEl) {
    selectEl.value = phrase;
    
    // 展开第3部分并滚动
    const details = document.getElementById('item-s3_0').closest('details');
    details.open = true;
    document.getElementById('item-s3_0').scrollIntoView({ behavior: 'smooth', block: 'center' });
    
    // 视觉反馈
    const itemEl = document.getElementById('item-s3_0');
    itemEl.style.transition = 'background 0.3s';
    itemEl.style.background = '#fff3c4';
    setTimeout(() => { itemEl.style.background = ''; }, 800);
  }
}

// 过滤逻辑
function applyFilter() {
  const showOnlyFav = document.getElementById('favToggle').checked;
  const items = document.querySelectorAll('.item, .phrase-item');
  
  items.forEach(el => {
    const id = el.getAttribute('id').replace('item-', '');
    if (showOnlyFav && !favorites[id]) el.classList.add('is-hidden');
    else el.classList.remove('is-hidden');
  });
  
  document.querySelectorAll('details').forEach(details => {
    if (showOnlyFav) {
      const hasVisible = details.querySelector('.item:not(.is-hidden), .phrase-item:not(.is-hidden)');
      details.open = !!hasVisible;
    }
  });
}

document.getElementById('favToggle').addEventListener('change', applyFilter);

// 启动
renderSteps();
renderBank();
</script>
</body>
</html>
