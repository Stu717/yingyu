<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>邀请信写作 · 复习手册</title>
<style>
  :root{
    --bg:#f7f6f2; --card:#fff; --ink:#1a1c1b; --muted:#6b6d68;
    --line:#e5e3db; --accent:#0d6e6e; --soft:#e6f2f2;
    --highlight:#fff3c4; --highlight-ink:#8a5a00;
    --star:#f59e0b; --star-gray:#d1d5db;
    --pill-bg:#f0f4f4; --pill-hover:#dcebea;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink); line-height:1.65;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  .wrap{max-width:800px; margin:0 auto; padding:0 20px}
  
  /* 顶部 */
  .hero{padding:40px 0 20px}
  .hero h1{font-size:26px; margin:0 0 8px}
  .hero p{margin:0; color:var(--muted); font-size:14px}
  
  /* 工具栏 */
  .toolbar{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 0; border-bottom:1px solid var(--line); margin-bottom:20px;
  }
  .toggle-wrap{display:flex; align-items:center; gap:8px; cursor:pointer; font-size:14px; color:var(--muted)}
  .toggle-wrap input{accent-color:var(--accent); width:16px; height:16px; margin:0}

  /* 步骤卡片 */
  details{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    margin-bottom:12px; overflow:hidden; transition:border-color .2s;
  }
  details[open]{border-color:#b0ccca; box-shadow:0 2px 8px rgba(0,0,0,.02)}
  summary{
    padding:16px 20px; cursor:pointer; list-style:none; display:flex; align-items:center;
    font-weight:600; font-size:16px; user-select:none;
  }
  summary::-webkit-details-marker{display:none}
  summary:before{
    content:'+'; font-size:18px; color:var(--accent); margin-right:12px; font-weight:700;
    transition:transform .2s;
  }
  details[open] summary:before{content:'−'; transform:rotate(180deg)}
  .badge{
    font-size:12px; color:var(--accent); background:var(--soft);
    padding:2px 8px; border-radius:6px; margin-right:12px;
  }
  
  .content{padding:0 20px 20px 20px; border-top:1px solid var(--line); padding-top:16px}
  .note{font-size:13.5px; color:var(--muted); margin:0 0 16px}
  
  /* 句子列表 */
  .item{
    display:flex; gap:12px; padding:10px 12px; border-radius:8px;
    margin-bottom:8px; background:#faf9f6; align-items:flex-start;
    transition:background .15s;
  }
  .item:hover{background:#fff; border:1px solid var(--line); padding:9px 11px}
  
  /* 标黄与填空逻辑 */
  .en{
    flex:1; font-family:ui-serif,Georgia,"Times New Roman",serif;
    font-size:15.5px; color:#22303a; line-height:1.7;
  }
  .en mark{
    background:var(--highlight); color:var(--highlight-ink);
    padding:2px 4px; border-radius:4px; font-weight:500;
  }
  .en strong{ color:var(--accent); font-weight:700; }
  
  /* 新增：互动填空槽位 */
  .blank-slot {
    display: inline-block;
    min-width: 80px;
    padding: 2px 8px;
    margin: 0 4px;
    background: #fff;
    border: 1.5px dashed #b0ccca;
    border-radius: 6px;
    color: var(--accent);
    cursor: pointer;
    font-weight: 600;
    font-size: 14.5px;
    text-align: center;
    transition: all .2s;
    position: relative;
  }
  .blank-slot:hover { background: var(--soft); border-color: var(--accent); }
  .blank-slot.has-value { background: #eef7f6; border-style: solid; color: var(--accent); }

  /* 素材药丸库（内联在第3部分） */
  .phrase-pool {
    margin-top: 12px; padding: 12px; background: #f4f8f8;
    border-radius: 8px; border: 1px solid #d0e3e1;
    display: none; /* 默认隐藏，点击填空处显示 */
  }
  .phrase-pool.show { display: block; animation: fadeIn .2s; }
  @keyframes fadeIn { from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:translateY(0);} }
  .pool-title { font-size: 12px; color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between;}
  .pool-close { cursor: pointer; color: var(--accent); }
  
  .pill-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .pill-group:last-child { margin-bottom: 0; }
  .pill-label { font-size: 12px; color: var(--amber); width: 100%; margin-bottom: -2px;}
  .pill {
    font-size: 13px; background: #fff; border: 1px solid #c5d8d7; padding: 4px 10px;
    border-radius: 99px; cursor: pointer; color: #14534f; transition: .15s;
    font-family: ui-serif,Georgia,serif;
  }
  .pill:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* 标签与收藏 */
  .tag{
    flex:0 0 auto; font-size:12px; color:var(--muted); background:#eae8e3;
    padding:2px 8px; border-radius:4px; margin-top:3px; white-space:nowrap;
  }
  .star-btn{
    background:none; border:none; cursor:pointer; font-size:20px;
    color:var(--star-gray); padding:0; margin-top:1px; transition:.15s; outline:none;
  }
  .star-btn:hover, .star-btn.active{color:var(--star)}
  
  /* 第8部分素材库 */
  .grid{display:grid; gap:12px; grid-template-columns:1fr; margin-top:10px}
  .type-box{background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px}
  .type-box h3{margin:0 0 10px; font-size:15px; color:var(--accent); display:flex; align-items:center; justify-content:space-between}
  .meta{font-size:13px; color:var(--muted); margin-bottom:8px}
  
  .phrase-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 10px; border-radius:6px; background:#faf9f6; margin-bottom:6px;
  }
  .phrase-item .en{font-size:14.5px; color:var(--accent); font-weight:600}
  .btn-use { font-size: 12px; color: var(--accent); background: transparent; border: 1px solid var(--accent); padding: 2px 8px; border-radius: 6px; cursor: pointer; margin-left: 8px;}
  .btn-use:hover { background: var(--accent); color: #fff;}

  .is-hidden { display:none !important; }
</style>
</head>
<body>

<div class="wrap">
  <div class="hero">
    <h1>邀请信写作 · 复习手册</h1>
    <p>点击第 3 部分的 <span style="color:#0d6e6e; border:1px dashed #0d6e6e; padding:0 4px; border-radius:4px;">下划线空</span> 可直接选择素材，体验“骨架+血肉”的组装。</p>
  </div>

  <div class="toolbar">
    <label class="toggle-wrap">
      <input type="checkbox" id="favToggle">
      <span>只看我收藏的句子</span>
    </label>
  </div>

  <div id="stepsContainer"></div>
  
  <div style="margin-top:30px">
    <details>
      <summary><span class="badge">08</span> 分类素材库</summary>
      <div class="content">
        <p class="note">丰富的短语库。点击“套用”可直接将该短语填入第 03 部分。</p>
        <div class="grid" id="bankGrid"></div>
      </div>
    </details>
  </div>
</div>

<script>
// 数据库（把第8部分的短语提取出来，供各处调用）
const materialBank = {
  '学术交流类': ['exchange ideas with other scholars', 'share your research findings', 'learn about the latest developments'],
  '指导点评类': ['offer guidance to young students', 'comment on their performances', 'discover talented students'],
  '社交拓展类': ['make new friends', 'meet people with similar interests', 'communicate with our students'],
  '放松娱乐类': ['relax and enjoy yourself', 'enjoy wonderful performances', 'spend a pleasant evening'],
  '展示分享类': ['share your valuable experience', 'present your ideas', 'show your talent']
};

// 步骤数据（注意第3部分的特殊占位符 {{slot}}）
const stepsData = [
  {
    id: 's1', title: '介绍自己',
    note: '题目只给“你是李明”时，按身份选择句式，黄色部分按需替换。',
    items: [
      { tag: '组织者', html: 'I am Li Ming, a student from <mark>____</mark> and one of the organizers of this activity.' },
      { tag: '老师/专家', html: 'I am Li Ming, a student representative from <mark>____</mark>.' },
      { tag: '示例', html: 'I am Li Ming, <mark>chairman of the Student Union</mark>.' }
    ]
  },
  {
    id: 's2', title: '写信目的 + 活动信息',
    note: '点明邀请目的，补充时间地点性质。',
    items: [
      { tag: '目的', html: 'It is my great pleasure to invite you to <mark>our annual forum</mark>.' },
      { tag: '目的', html: 'On behalf of the Student Union, I would like to invite you to <mark>deliver a lecture</mark>.' },
      { tag: '合并句', html: '<mark>..., which will be held in the school auditorium at 2 p.m. on June 15th.</mark>' }
    ]
  },
  {
    id: 's3', title: '活动对收信人的好处', // 🔥 重点改造区
    note: '点击下划线空格，会弹出素材库。体验如何把第 8 部分的短语装进句式。',
    items: [
      { 
        tag: '好处', 
        isSlot: true, 
        html: 'The activity will <strong>provide you with a good opportunity</strong> to <span class="blank-slot" data-slot-id="slot1">选择素材 ▼</span>.' 
      },
      { 
        tag: '好处', 
        isSlot: true, 
        html: 'The activity will <strong>enable you</strong> to <span class="blank-slot" data-slot-id="slot2">选择素材 ▼</span>.' 
      }
    ]
  },
  {
    id: 's4', title: '适度恭维收信人',
    note: '一两句即可，表达对专家的尊重。',
    items: [
      { tag: '恭维', html: 'As <mark>an expert in this field</mark>, you are widely respected by our students.' },
      { tag: '恭维', html: 'With <mark>your rich experience in this area</mark>, you would be a most welcome guest.' }
    ]
  },
  {
    id: 's5', title: '明确请求 + 截止时间',
    note: '请求要具体，截止时间明确。',
    items: [
      { tag: '请求', html: 'We would be grateful if you could <strong>confirm your attendance</strong> before <mark>June 10th</mark>.' },
      { tag: '请求', html: 'Please <strong>let us know</strong> whether you can come by <mark>June 10th</mark>.' }
    ]
  },
  {
    id: 's6', title: '客套话 + 期待回复',
    note: '收尾礼节，自然简洁。',
    items: [
      { tag: '客套', html: 'Should you have any questions, please do not hesitate to contact me.' },
      { tag: '期待', html: 'Looking forward to your reply.' }
    ]
  }
];

let favorites = JSON.parse(localStorage.getItem('invitation_favs')) || {};
let slotsValue = {}; // 记录填入了什么

function saveFavs() {
  localStorage.setItem('invitation_favs', JSON.stringify(favorites));
  applyFilter();
}

function toggleStar(id) {
  if (favorites[id]) delete favorites[id];
  else favorites[id] = true;
  saveFavs();
  renderSteps();
  renderBank();
}

// 渲染步骤
function renderSteps() {
  const container = document.getElementById('stepsContainer');
  container.innerHTML = stepsData.map(step => `
    <details ${step.id === 's3' ? 'open' : ''}>
      <summary><span class="badge">${step.id.slice(1)}</span> ${step.title}</summary>
      <div class="content">
        <p class="note">${step.note}</p>
        ${step.items.map((item, idx) => {
          const itemId = `${step.id}_${idx}`;
          const isStarred = favorites[itemId];
          
          // 如果是第3部分的互动句型，加入素材池
          let poolHTML = '';
          if (item.isSlot) {
            poolHTML = `
              <div class="phrase-pool" id="pool-${itemId}">
                <div class="pool-title"><span>选择一个短语填入：</span><span class="pool-close" onclick="closePool('${itemId}')">关闭</span></div>
                ${Object.entries(materialBank).map(([cat, phrases]) => `
                  <div class="pill-group">
                    <span class="pill-label">${cat}</span>
                    ${phrases.map(p => `<span class="pill" onclick="insertPhrase('${itemId}', '${p}')">${p}</span>`).join('')}
                  </div>
                `).join('')}
              </div>
            `;
          }

          return `
            <div class="item ${item.isSlot ? 'interactive-item' : ''}" data-id="${itemId}" id="item-${itemId}">
              <span class="tag">${item.tag}</span>
              <span class="en">${item.html}</span>
              <button class="star-btn ${isStarred ? 'active' : ''}" onclick="toggleStar('${itemId}')">${isStarred ? '★' : '☆'}</button>
            </div>
            ${poolHTML}
          `;
        }).join('')}
      </div>
    </details>
  `).join('');
  
  // 绑定点击槽位事件
  document.querySelectorAll('.blank-slot').forEach(slot => {
    slot.addEventListener('click', function(e) {
      const itemEl = this.closest('.item');
      const poolId = 'pool-' + itemEl.dataset.id;
      // 关闭其他所有池
      document.querySelectorAll('.phrase-pool').forEach(p => { if(p.id !== poolId) p.classList.remove('show') });
      document.getElementById(poolId).classList.toggle('show');
    });
  });
  
  applyFilter();
}

// 插入短语
window.insertPhrase = function(itemId, phrase) {
  const itemEl = document.getElementById('item-' + itemId);
  const slot = itemEl.querySelector('.blank-slot');
  slot.textContent = phrase;
  slot.classList.add('has-value');
  document.getElementById('pool-' + itemId).classList.remove('show');
}

window.closePool = function(itemId) {
  document.getElementById('pool-' + itemId).classList.remove('show');
}

// 渲染第8部分素材库
function renderBank() {
  const grid = document.getElementById('bankGrid');
  grid.innerHTML = Object.entries(materialBank).map(([cat, phrases], tIdx) => `
    <div class="type-box">
      <h3>${cat}</h3>
      ${phrases.map((phrase, pIdx) => {
        const itemId = `bank_${tIdx}_${pIdx}`;
        const isStarred = favorites[itemId];
        return `
          <div class="phrase-item" data-id="${itemId}">
            <div style="flex:1;">
              <span class="en">${phrase}</span>
            </div>
            <div style="display:flex; align-items:center;">
              <button class="btn-use" onclick="useInStep3('${phrase}')">套用</button>
              <button class="star-btn ${isStarred ? 'active' : ''}" onclick="toggleStar('${itemId}')">${isStarred ? '★' : '☆'}</button>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `).join('');
  applyFilter();
}

// 从第8部分快捷套用到第3部分
window.useInStep3 = function(phrase) {
  // 默认填入 slot1 (provide opportunity 句式)
  const itemId = 's3_0'; 
  const itemEl = document.getElementById('item-' + itemId);
  const slot = itemEl.querySelector('.blank-slot');
  slot.textContent = phrase;
  slot.classList.add('has-value');
  
  // 视觉反馈：滚动并闪烁
  const details = document.getElementById('step-s3').closest('details');
  details.open = true;
  document.getElementById('step-s3').scrollIntoView({ behavior: 'smooth', block: 'center' });
  
  const itemBg = itemEl.style.background;
  itemEl.style.background = '#fff3c4';
  setTimeout(() => { itemEl.style.background = itemBg || '#faf9f6'; }, 800);
}

// 过滤逻辑
function applyFilter() {
  const showOnlyFav = document.getElementById('favToggle').checked;
  const items = document.querySelectorAll('.item, .phrase-item');
  
  items.forEach(el => {
    const id = el.getAttribute('data-id');
    if (showOnlyFav && !favorites[id]) el.classList.add('is-hidden');
    else el.classList.remove('is-hidden');
  });
  
  document.querySelectorAll('details').forEach(details => {
    if (showOnlyFav) {
      const hasVisible = details.querySelector('.item:not(.is-hidden), .phrase-item:not(.is-hidden)');
      details.open = !!hasVisible;
    }
  });
}

document.getElementById('favToggle').addEventListener('change', applyFilter);

// 启动
renderSteps();
renderBank();
</script>
</body>
</html>
