<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>邀请信写作 · 复习手册</title>
<style>
  :root{
    --bg:#f7f6f2; --card:#fff; --ink:#1a1c1b; --muted:#6b6d68;
    --line:#e5e3db; --accent:#0d6e6e; --soft:#e6f2f2;
    --highlight:#fff3c4; --highlight-ink:#8a5a00;
    --star:#f59e0b; --star-gray:#d1d5db;
    --blur-amt: 4px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink); line-height:1.65;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  .wrap{max-width:800px; margin:0 auto; padding:0 20px}
  
  /* 顶部 */
  .hero{padding:40px 0 20px}
  .hero h1{font-size:26px; margin:0 0 8px}
  .hero p{margin:0; color:var(--muted); font-size:14px}
  .hero mark { background: var(--highlight); color: var(--highlight-ink); padding: 2px 6px; border-radius: 4px; border: 1px dashed var(--highlight-ink); font-weight: 600;}
  .hero strong { color: var(--accent); }
  
  /* 工具栏 */
  .toolbar{
    display:flex; flex-wrap:wrap; gap:16px;
    padding:14px 0; border-bottom:1px solid var(--line); margin-bottom:20px;
  }
  .toggle-wrap{display:flex; align-items:center; gap:8px; cursor:pointer; font-size:14px; color:var(--muted)}
  .toggle-wrap input{accent-color:var(--accent); width:16px; height:16px; margin:0}

  /* 步骤卡片 */
  details{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    margin-bottom:12px; overflow:hidden; transition:border-color .2s;
  }
  details[open]{border-color:#b0ccca; box-shadow:0 2px 8px rgba(0,0,0,.02)}
  summary{
    padding:16px 20px; cursor:pointer; list-style:none; display:flex; align-items:center;
    font-weight:600; font-size:16px; user-select:none;
  }
  summary::-webkit-details-marker{display:none}
  summary:before{
    content:'+'; font-size:18px; color:var(--accent); margin-right:12px; font-weight:700;
    transition:transform .2s;
  }
  details[open] summary:before{content:'−'; transform:rotate(180deg)}
  .badge{
    font-size:12px; color:var(--accent); background:var(--soft);
    padding:2px 8px; border-radius:6px; margin-right:12px;
  }
  
  .content{padding:0 20px 20px 20px; border-top:1px solid var(--line); padding-top:16px}
  .note{font-size:13.5px; color:var(--muted); margin:0 0 16px}
  
  /* 句子列表 */
  .item{
    display:flex; gap:12px; padding:10px 12px; border-radius:8px;
    margin-bottom:8px; background:#faf9f6; align-items:flex-start;
    transition:background .15s;
  }
  .item:hover{background:#fff; border:1px solid var(--line); padding:9px 11px}
  
  /* 标黄与加粗逻辑 */
  .en{
    flex:1; font-family:ui-serif,Georgia,"Times New Roman",serif;
    font-size:15.5px; color:#22303a; line-height:2.2; word-break: break-word;
    transition: filter .2s;
  }
  .en strong { color: var(--accent); font-weight: 700; }
  
  /* 模糊自测逻辑 */
  body.masked .en { filter: blur(var(--blur-amt)); cursor: help; }
  body.masked .en:hover, body.masked .en.revealed { filter: none; cursor: text; }
  body.masked .blank-slot { filter: none !important; } /* 下拉框保持清晰 */

  /* 黄色虚线槽位 */
  .blank-slot {
    display: inline-block;
    min-width: 60px;
    background-color: var(--highlight);
    color: var(--highlight-ink);
    border: 1.5px dashed var(--highlight-ink);
    border-radius: 4px;
    padding: 0 8px;
    margin: 0 2px;
    cursor: pointer;
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 600;
    text-align: center;
    transition: all .2s;
    user-select: none;
    vertical-align: baseline;
  }
  .blank-slot:hover { background-color: #ffe89a; border-style: solid; }
  .blank-slot.has-value { border-style: solid; background-color: #fff7db; color: var(--accent); }

  /* 弹出药丸面板 */
  .phrase-pool {
    margin: 4px 0 16px 0; padding: 14px; background: #f4f8f8;
    border-radius: 8px; border: 1px solid #d0e3e1;
    display: none; 
  }
  .phrase-pool.show { display: block; animation: fadeIn .2s; }
  @keyframes fadeIn { from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:translateY(0);} }
  
  .pool-title { 
    font-size: 12px; color: var(--muted); margin-bottom: 10px; 
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid #d0e3e1; padding-bottom: 6px;
  }
  .pool-close { cursor: pointer; color: var(--accent); font-size: 12px; border: 1px solid var(--accent); padding: 2px 8px; border-radius: 4px; }
  .pool-close:hover { background: var(--accent); color: #fff; }
  
  .pill-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .pill-group:last-child { margin-bottom: 0; }
  .pill-label { font-size: 12px; color: var(--muted); width: 100%; margin-bottom: -2px; font-weight: bold;}
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; background: #fff; border: 1px solid #c5d8d7; padding: 4px 10px;
    border-radius: 99px; cursor: pointer; color: #14534f; transition: .15s;
    font-family: ui-serif,Georgia,serif;
  }
  .pill:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  
  /* 自定义删除小叉 */
  .pill-del {
    color: #999; font-size: 14px; font-weight: bold; line-height: 1;
    padding: 0 4px; border-radius: 50%;
  }
  .pill-del:hover { color: #d32f2f; background: rgba(0,0,0,0.1); }

  /* 自定义输入表单 */
  .custom-form {
    display: flex; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed #d0e3e1;
  }
  .custom-input {
    flex: 1; border: 1px solid #c5d8d7; border-radius: 6px; padding: 6px 10px;
    font-size: 13px; font-family: inherit; outline: none; transition: border .2s;
  }
  .custom-input:focus { border-color: var(--accent); }
  .custom-btn {
    background: var(--accent); color: #fff; border: none; border-radius: 6px;
    padding: 0 14px; cursor: pointer; font-size: 13px; transition: background .2s;
  }
  .custom-btn:hover { background: #0a5555; }

  /* 标签与收藏 */
  .tag{
    flex:0 0 auto; font-size:12px; color:var(--muted); background:#eae8e3;
    padding:2px 8px; border-radius:4px; margin-top:6px; white-space:nowrap;
  }
  .star-btn{
    background:none; border:none; cursor:pointer; font-size:20px;
    color:var(--star-gray); padding:0; margin-top:4px; transition:.15s; outline:none;
  }
  .star-btn:hover, .star-btn.active{color:var(--star)}
  
  /* 第8部分素材库 */
  .grid{display:grid; gap:12px; grid-template-columns:1fr; margin-top:10px}
  .type-box{background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px}
  .type-box h3{margin:0 0 10px; font-size:15px; color:var(--accent); display:flex; align-items:center; justify-content:space-between}
  .meta{font-size:13px; color:var(--muted); margin-bottom:8px}
  
  .phrase-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 10px; border-radius:6px; background:#faf9f6; margin-bottom:6px;
  }
  .phrase-item .en{font-size:14.5px; color:var(--accent); font-weight:700; line-height:1.4;}

  .is-hidden { display:none !important; }
</style>
</head>
<body>

<div class="wrap">
  <div class="hero">
    <h1>邀请信写作 · 复习手册</h1>
    <p>
      <mark>黄色虚线框</mark>为需替换词汇（点击弹出面板，支持自定义）；<br>
      <strong>青色加粗</strong>为背诵时要抓住的核心动词搭配。
    </p>
  </div>

  <div class="toolbar">
    <label class="toggle-wrap">
      <input type="checkbox" id="favToggle">
      <span>只看我收藏的句子</span>
    </label>
    <label class="toggle-wrap">
      <input type="checkbox" id="maskToggle">
      <span>开启模糊自测 (悬浮或点击清晰)</span>
    </label>
  </div>

  <div id="stepsContainer"></div>
  
  <div style="margin-top:30px">
    <details>
      <summary><span class="badge">08</span> 分类素材库</summary>
      <div class="content">
        <p class="note">核心短语库，可直接复习或收藏。</p>
        <div class="grid" id="bankGrid"></div>
      </div>
    </details>
  </div>
</div>

<script>
// 记录最后点击的槽位
let lastFocusedSlot = null;

// 默认基础素材
const defaultBank = {
  '学术交流类': ['exchange ideas with other scholars', 'share your research findings', 'learn about the latest developments in the field', 'meet other experts'],
  '指导点评类': ['offer guidance to young students', 'comment on their performances', 'discover talented students'],
  '社交拓展类': ['make new friends', 'meet people with similar interests', 'communicate with our students and teachers'],
  '放松娱乐类': ['relax and enjoy yourself', 'enjoy wonderful performances', 'spend a pleasant evening with us'],
  '展示分享类': ['share your valuable experience', 'present your ideas', 'show your talent'],
  '了解合作类': ['learn more about our students', 'promote cooperation with our university', 'build closer ties with us']
};

const defaultPool = {
  'activity': ['an English speech contest', 'an academic lecture', 'a cultural exchange activity', 'a graduation ceremony', 'a campus seminar'],
  'location': ['in the school auditorium at 2 p.m. on June 15th', 'in Meeting Room 201 at 3 p.m. next Friday', 'in the conference hall on the morning of June 20th'],
  'action': ['confirm your attendance', 'give a short speech at the activity', 'prepare a brief introduction to...'],
  'deadline': ['June 10th', 'next Friday'],
  'department': ['the School of Foreign Languages', 'the School of Economics'],
  'role': ['chairman', 'president']
};

// 读取自定义数据
let customPoolData = JSON.parse(localStorage.getItem('custom_pool_data')) || {};

// 保存自定义数据
function saveCustomData() {
  localStorage.setItem('custom_pool_data', JSON.stringify(customPoolData));
}

// 根据类型生成面板 HTML (融合自定义数据)
function getPoolHTML(type) {
  let title = '选择素材';
  let groups = [];
  
  if (type === 'activity') {
    title = '活动类型'; groups = [{ name: '可选活动', items: defaultPool.activity }];
  } else if (type === 'location') {
    title = '时间地点'; groups = [{ name: '可选时间地点', items: defaultPool.location }];
  } else if (type === 'benefit') {
    title = '第8部分 · 好处素材库';
    groups = Object.entries(defaultBank).map(([k, v]) => ({ name: k, items: v }));
  } else if (type === 'action') {
    title = '请求动作'; groups = [{ name: '具体动作', items: defaultPool.action }];
  } else if (type === 'deadline') {
    title = '截止时间'; groups = [{ name: '时间', items: defaultPool.deadline }];
  } else if (type === 'department') {
    title = '院系'; groups = [{ name: '院系', items: defaultPool.department }];
  } else if (type === 'role') {
    title = '职务'; groups = [{ name: '职务', items: defaultPool.role }];
  }

  // 检查是否有自定义数据并加入分组
  if (customPoolData[type] && customPoolData[type].length > 0) {
    groups.push({ name: '自定义补充', items: customPoolData[type], isCustom: true });
  }

  let html = `<div class="pool-title"><span>${title}</span><span class="pool-close">关闭面板</span></div>`;
  
  groups.forEach(g => {
    html += `<div class="pill-group"><span class="pill-label">${g.name}</span>`;
    g.items.forEach(item => {
      const safeVal = item.replace(/"/g, '&quot;');
      // 如果是自定义分组，增加删除按钮
      const delBtn = g.isCustom ? `<span class="pill-del" data-type="${type}" data-val="${safeVal}" title="删除该词条">×</span>` : '';
      html += `<span class="pill" data-value="${safeVal}">${item} ${delBtn}</span>`;
    });
    html += `</div>`;
  });

  // 底部加入自定义输入框
  html += `
    <form class="custom-form" data-type="${type}">
      <input type="text" class="custom-input" placeholder="输入想要补充的短语，按回车添加..." required>
      <button type="submit" class="custom-btn">添加</button>
    </form>
  `;

  return html;
}

// 生成槽位 HTML
const slot = (type, defaultText) => `<span class="blank-slot" data-pool="${type}" data-default="${defaultText}">${defaultText}</span>`;

const stepsData = [
  {
    id: 's1', title: '介绍自己',
    note: '根据收信人身份，选择对应句式。',
    items: [
      { tag: '组织者', html: `I am Li Ming, a student from ${slot('department', '院系')} and <strong>one of the organizers</strong> of this activity.` },
      { tag: '邀请老师', html: `I am Li Ming, a <strong>student representative</strong> from ${slot('department', '院系')}.` },
      { tag: '负责人', html: `I am Li Ming, ${slot('role', '职务')} of the Student Union.` },
      { tag: '示例', html: 'I am Li Ming, <strong>chairman of the Student Union</strong>.' },
      { tag: '示例', html: 'I am Li Ming, a <strong>graduate student</strong> from the School of Foreign Languages.' }
    ]
  },
  {
    id: 's2', title: '写信目的 + 活动信息',
    note: '合并句式填空：先选活动类型，再选时间地点。',
    items: [
      { tag: '目的', html: 'It is my great pleasure to <strong>invite you to our annual forum</strong>.' },
      { tag: '目的', html: 'On behalf of the Student Union, I would like to <strong>invite you to deliver a lecture</strong>.' },
      { 
        tag: '合并句', 
        html: `..., an activity themed ${slot('activity', '活动类型')}, which <strong>will be held</strong> ${slot('location', '时间地点')}.` 
      }
    ]
  },
  {
    id: 's3', title: '活动对收信人的好处',
    note: '青色部分为核心骨架，点击黄色虚线框弹出第 8 部分的素材。',
    items: [
      { tag: '好处', html: `The activity will <strong>provide you with a good opportunity</strong> to ${slot('benefit', '选择素材')}.` },
      { tag: '好处', html: `The activity will <strong>enable you</strong> to ${slot('benefit', '选择素材')}.` },
      { tag: '好处', html: `The activity will <strong>be a good chance for you</strong> to ${slot('benefit', '选择素材')}.` },
      { tag: '完整句', html: 'Your participation will <strong>be of great benefit</strong> to our students.' }
    ]
  },
  {
    id: 's4', title: '适度恭维收信人',
    note: '一两句即可，把握核心赞美词。',
    items: [
      { tag: '恭维', html: 'As <strong>an expert in this field</strong>, you are <strong>widely respected by our students</strong>.' },
      { tag: '恭维', html: 'With <strong>your rich experience in this area</strong>, <strong>you would be a most welcome guest</strong>.' },
      { tag: '恭维', html: 'As <strong>a highly respected scholar</strong>, ...' },
      { tag: '恭维', html: '<strong>Your presence would be greatly appreciated</strong>.' }
    ]
  },
  {
    id: 's5', title: '明确请求 + 截止时间',
    note: '具体动作和截止时间均可点击替换。',
    items: [
      { tag: '完整句', html: `<strong>We would be grateful if you could</strong> ${slot('action', '动作')} before ${slot('deadline', '时间')}.` },
      { tag: '完整句', html: `Please <strong>let us know whether you can come</strong> by ${slot('deadline', '时间')}.` }
    ]
  },
  {
    id: 's6', title: '客套话',
    note: '收尾礼节。',
    items: [
      { tag: '客套', html: 'Should you have any questions, please <strong>do not hesitate to contact me</strong>.' },
      { tag: '客套', html: 'We <strong>look forward to welcoming you</strong> to our university.' },
      { tag: '客套', html: 'Thank you for your time and consideration.' },
      { tag: '客套', html: 'We would appreciate your kind reply.' },
      { tag: '客套', html: 'Thank you in advance for your support.' }
    ]
  },
  {
    id: 's7', title: '期待回复',
    note: '结尾固定收束句。',
    items: [
      { tag: '结尾', html: '<strong>Looking forward to</strong> your reply.' },
      { tag: '结尾', html: 'We <strong>look forward to hearing from you</strong> soon.' }
    ]
  }
];

let favorites = JSON.parse(localStorage.getItem('invitation_favs')) || {};

function renderSteps() {
  const container = document.getElementById('stepsContainer');
  container.innerHTML = stepsData.map(step => `
    <details ${step.id === 's2' || step.id === 's3' ? 'open' : ''}>
      <summary><span class="badge">${step.id.slice(1)}</span> ${step.title}</summary>
      <div class="content">
        <p class="note">${step.note}</p>
        ${step.items.map((item, idx) => {
          const itemId = `${step.id}_${idx}`;
          const isStarred = favorites[itemId] ? 'active' : '';
          const starChar = favorites[itemId] ? '★' : '☆';
          const hasSlot = item.html.includes('blank-slot');
          
          return `
            <div class="item" id="item-${itemId}">
              <span class="tag">${item.tag}</span>
              <span class="en" onclick="toggleReveal(this)">${item.html}</span>
              <button class="star-btn ${isStarred}" data-id="${itemId}">${starChar}</button>
            </div>
            ${hasSlot ? `<div class="phrase-pool" id="pool-${itemId}"></div>` : ''}
          `;
        }).join('')}
      </div>
    </details>
  `).join('');
  applyFilter();
}

function renderBank() {
  const grid = document.getElementById('bankGrid');
  grid.innerHTML = Object.entries(defaultBank).map(([cat, phrases], tIdx) => `
    <div class="type-box">
      <h3>${cat}</h3>
      ${phrases.map((phrase, pIdx) => {
        const itemId = `bank_${tIdx}_${pIdx}`;
        const isStarred = favorites[itemId] ? 'active' : '';
        const starChar = favorites[itemId] ? '★' : '☆';
        return `
          <div class="phrase-item" id="item-${itemId}">
            <div style="flex:1;">
              <span class="en" onclick="toggleReveal(this)">${phrase}</span>
            </div>
            <button class="star-btn ${isStarred}" data-id="${itemId}">${starChar}</button>
          </div>
        `;
      }).join('')}
    </div>
  `).join('');
  applyFilter();
}

// 模糊状态下点击解锁（移动端友好）
window.toggleReveal = function(el) {
  if (document.body.classList.contains('masked')) {
    el.classList.toggle('revealed');
  }
};

// 统一事件管理
document.addEventListener('click', function(e) {
  // 1. 处理收藏
  const starBtn = e.target.closest('.star-btn');
  if (starBtn) {
    const id = starBtn.dataset.id;
    if (favorites[id]) {
      delete favorites[id];
      starBtn.classList.remove('active');
      starBtn.textContent = '☆';
    } else {
      favorites[id] = true;
      starBtn.classList.add('active');
      starBtn.textContent = '★';
    }
    localStorage.setItem('invitation_favs', JSON.stringify(favorites));
    if (document.getElementById('favToggle').checked) applyFilter();
    return;
  }

  // 2. 点击黄色虚线槽位 -> 弹出面板
  const slot = e.target.closest('.blank-slot');
  if (slot) {
    e.stopPropagation();
    lastFocusedSlot = slot;
    const item = slot.closest('.item');
    const pool = item.nextElementSibling;

    if (pool.classList.contains('show')) {
      pool.classList.remove('show');
      return;
    }

    document.querySelectorAll('.phrase-pool').forEach(p => p.classList.remove('show'));
    const type = slot.getAttribute('data-pool');
    pool.innerHTML = getPoolHTML(type);
    pool.classList.add('show');
    return;
  }

  // 3. 点击药丸选项填入
  const pill = e.target.closest('.pill');
  if (pill && !e.target.classList.contains('pill-del')) {
    e.stopPropagation();
    const val = pill.getAttribute('data-value');
    if (lastFocusedSlot) {
      lastFocusedSlot.textContent = val;
      lastFocusedSlot.classList.add('has-value');
      lastFocusedSlot.closest('.item').nextElementSibling.classList.remove('show');
    }
    return;
  }

  // 4. 删除自定义词条
  const delBtn = e.target.closest('.pill-del');
  if (delBtn) {
    e.stopPropagation();
    const type = delBtn.dataset.type;
    const val = delBtn.dataset.val;
    if (customPoolData[type]) {
      customPoolData[type] = customPoolData[type].filter(item => item !== val);
      if (customPoolData[type].length === 0) delete customPoolData[type];
      saveCustomData();
      
      // 重新渲染当前展开的面板
      if(lastFocusedSlot) {
        const pool = lastFocusedSlot.closest('.item').nextElementSibling;
        pool.innerHTML = getPoolHTML(type);
      }
    }
    return;
  }

  // 5. 关闭面板
  if (e.target.classList.contains('pool-close')) {
    e.stopPropagation();
    e.target.closest('.phrase-pool').classList.remove('show');
    return;
  }

  // 6. 点击空白处关闭所有面板
  if (!e.target.closest('.phrase-pool')) {
    document.querySelectorAll('.phrase-pool').forEach(p => p.classList.remove('show'));
  }
});

// 监听表单提交（添加自定义词汇）
document.addEventListener('submit', function(e) {
  if (e.target.classList.contains('custom-form')) {
    e.preventDefault();
    const form = e.target;
    const type = form.getAttribute('data-type');
    const input = form.querySelector('.custom-input');
    const val = input.value.trim();
    
    if (val) {
      if (!customPoolData[type]) customPoolData[type] = [];
      // 防重复
      if (!customPoolData[type].includes(val) && !(defaultPool[type] && defaultPool[type].includes(val))) {
        customPoolData[type].push(val);
        saveCustomData();
      }
      
      // 重新渲染面板并清空输入框
      if(lastFocusedSlot) {
        const pool = lastFocusedSlot.closest('.item').nextElementSibling;
        pool.innerHTML = getPoolHTML(type);
      }
    }
  }
});

// 顶部开关逻辑
document.getElementById('maskToggle').addEventListener('change', function(e) {
  document.body.classList.toggle('masked', e.target.checked);
  // 关闭时清除所有已解锁状态
  if (!e.target.checked) {
    document.querySelectorAll('.revealed').forEach(el => el.classList.remove('revealed'));
  }
});

function applyFilter() {
  const showOnlyFav = document.getElementById('favToggle').checked;
  const items = document.querySelectorAll('.item, .phrase-item');
  
  items.forEach(el => {
    const id = el.getAttribute('id').replace('item-', '');
    if (showOnlyFav && !favorites[id]) el.classList.add('is-hidden');
    else el.classList.remove('is-hidden');
  });
  
  document.querySelectorAll('details').forEach(details => {
    if (showOnlyFav) {
      const hasVisible = details.querySelector('.item:not(.is-hidden), .phrase-item:not(.is-hidden)');
      details.open = !!hasVisible;
    }
  });
}

document.getElementById('favToggle').addEventListener('change', applyFilter);

// 初始化
renderSteps();
renderBank();
</script>
</body>
</html>
