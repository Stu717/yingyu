<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>邀请信写作 · 复习手册</title>
<style>
  :root{
    --bg:#f7f6f2; --card:#fff; --ink:#1a1c1b; --muted:#6b6d68;
    --line:#e5e3db; --accent:#0d6e6e; --soft:#e6f2f2;
    --highlight:#fff3c4; --highlight-ink:#8a5a00;
    --star:#f59e0b; --star-gray:#d1d5db;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink); line-height:1.65;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  .wrap{max-width:800px; margin:0 auto; padding:0 20px}
  
  /* 顶部 */
  .hero{padding:40px 0 20px}
  .hero h1{font-size:26px; margin:0 0 8px}
  .hero p{margin:0; color:var(--muted); font-size:14px}
  
  /* 工具栏 */
  .toolbar{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 0; border-bottom:1px solid var(--line); margin-bottom:20px;
  }
  .toggle-wrap{display:flex; align-items:center; gap:8px; cursor:pointer; font-size:14px; color:var(--muted)}
  .toggle-wrap input{accent-color:var(--accent); width:16px; height:16px; margin:0}

  /* 步骤卡片 */
  details{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    margin-bottom:12px; overflow:hidden; transition:border-color .2s;
  }
  details[open]{border-color:#b0ccca; box-shadow:0 2px 8px rgba(0,0,0,.02)}
  summary{
    padding:16px 20px; cursor:pointer; list-style:none; display:flex; align-items:center;
    font-weight:600; font-size:16px; user-select:none;
  }
  summary::-webkit-details-marker{display:none}
  summary:before{
    content:'+'; font-size:18px; color:var(--accent); margin-right:12px; font-weight:700;
    transition:transform .2s;
  }
  details[open] summary:before{content:'−'; transform:rotate(180deg)}
  .badge{
    font-size:12px; color:var(--accent); background:var(--soft);
    padding:2px 8px; border-radius:6px; margin-right:12px;
  }
  
  .content{padding:0 20px 20px 20px; border-top:1px solid var(--line); padding-top:16px}
  .note{font-size:13.5px; color:var(--muted); margin:0 0 16px}
  
  /* 句子列表 */
  .item{
    display:flex; gap:12px; padding:10px 12px; border-radius:8px;
    margin-bottom:8px; background:#faf9f6; align-items:flex-start;
    transition:background .15s;
  }
  .item:hover{background:#fff; border:1px solid var(--line); padding:9px 11px}
  
  /* 标黄与填空逻辑 */
  .en{
    flex:1; font-family:ui-serif,Georgia,"Times New Roman",serif;
    font-size:15.5px; color:#22303a; line-height:1.7; word-break: break-word;
  }
  .en mark{
    background:var(--highlight); color:var(--highlight-ink);
    padding:2px 4px; border-radius:4px; font-weight:500;
  }
  .en strong{ color:var(--accent); font-weight:700; }
  
  /* 互动填空槽位 */
  .blank-slot {
    display: inline-block;
    min-width: 80px;
    padding: 2px 8px;
    margin: 0 4px;
    background: #fff;
    border: 1.5px dashed #b0ccca;
    border-radius: 6px;
    color: var(--accent);
    cursor: pointer;
    font-weight: 600;
    font-size: 14.5px;
    text-align: center;
    transition: all .2s;
    position: relative;
    vertical-align: baseline;
  }
  .blank-slot:hover { background: var(--soft); border-color: var(--accent); }
  .blank-slot.has-value { background: #eef7f6; border-style: solid; color: var(--accent); }

  /* 素材药丸库 */
  .phrase-pool {
    margin-top: 8px; margin-bottom: 16px; padding: 12px; background: #f4f8f8;
    border-radius: 8px; border: 1px solid #d0e3e1;
    display: none; 
  }
  .phrase-pool.show { display: block; animation: fadeIn .2s; }
  @keyframes fadeIn { from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:translateY(0);} }
  .pool-title { font-size: 12px; color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between; align-items:center;}
  .pool-close { cursor: pointer; color: var(--accent); font-size: 12px; border: 1px solid var(--accent); padding: 2px 8px; border-radius: 4px; }
  .pool-close:hover { background: var(--accent); color: #fff; }
  
  .pill-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .pill-group:last-child { margin-bottom: 0; }
  .pill-label { font-size: 12px; color: var(--muted); width: 100%; margin-bottom: -2px; font-weight: bold;}
  .pill {
    font-size: 13px; background: #fff; border: 1px solid #c5d8d7; padding: 4px 10px;
    border-radius: 99px; cursor: pointer; color: #14534f; transition: .15s;
    font-family: ui-serif,Georgia,serif;
  }
  .pill:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* 标签与收藏 */
  .tag{
    flex:0 0 auto; font-size:12px; color:var(--muted); background:#eae8e3;
    padding:2px 8px; border-radius:4px; margin-top:3px; white-space:nowrap;
  }
  .star-btn{
    background:none; border:none; cursor:pointer; font-size:20px;
    color:var(--star-gray); padding:0; margin-top:1px; transition:.15s; outline:none;
  }
  .star-btn:hover, .star-btn.active{color:var(--star)}
  
  /* 第8部分素材库 */
  .grid{display:grid; gap:12px; grid-template-columns:1fr; margin-top:10px}
  .type-box{background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px}
  .type-box h3{margin:0 0 10px; font-size:15px; color:var(--accent); display:flex; align-items:center; justify-content:space-between}
  .meta{font-size:13px; color:var(--muted); margin-bottom:8px}
  
  .phrase-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 10px; border-radius:6px; background:#faf9f6; margin-bottom:6px;
  }
  .phrase-item .en{font-size:14.5px; color:var(--accent); font-weight:600}
  .btn-use { font-size: 12px; color: var(--accent); background: transparent; border: 1px solid var(--accent); padding: 2px 8px; border-radius: 6px; cursor: pointer; margin-left: 8px; white-space: nowrap;}
  .btn-use:hover { background: var(--accent); color: #fff;}

  .is-hidden { display:none !important; }
</style>
</head>
<body>

<div class="wrap">
  <div class="hero">
    <h1>邀请信写作 · 复习手册</h1>
    <p>高亮内容支持点击替换。体验“骨架+血肉”的拼装，背完点击 ⭐ 收藏。</p>
  </div>

  <div class="toolbar">
    <label class="toggle-wrap">
      <input type="checkbox" id="favToggle">
      <span>只看我收藏的句子</span>
    </label>
  </div>

  <div id="stepsContainer"></div>
  
  <div style="margin-top:30px">
    <details>
      <summary><span class="badge">08</span> 分类素材库</summary>
      <div class="content">
        <p class="note">丰富的短语库。点击“套用”可直接将该短语填入第 03 部分。</p>
        <div class="grid" id="bankGrid"></div>
      </div>
    </details>
  </div>
</div>

<script>
// ---------- 数据篇（查漏补缺：完全对齐 PDF） ----------

// 第2、3部分联动的素材库
const materialBank = {
  '活动类型 (Sec 2)': ['an English speech contest', 'an academic lecture', 'a cultural exchange activity', 'a graduation ceremony', 'a campus seminar'],
  '时间地点 (Sec 2)': ['in the school auditorium at 2 p.m. on June 15th', 'in Meeting Room 201 at 3 p.m. next Friday', 'in the conference hall on the morning of June 20th'],
  '学术交流 (Sec 8)': ['exchange ideas with other scholars', 'share your research findings', 'learn about the latest developments in the field', 'meet other experts'],
  '指导点评 (Sec 8)': ['offer guidance to young students', 'comment on their performances', 'discover talented students'],
  '社交拓展 (Sec 8)': ['make new friends', 'meet people with similar interests', 'communicate with our students and teachers'],
  '放松娱乐 (Sec 8)': ['relax and enjoy yourself', 'enjoy wonderful performances', 'spend a pleasant evening with us'],
  '展示分享 (Sec 8)': ['share your valuable experience', 'present your ideas', 'show your talent'],
  '了解合作 (Sec 8)': ['learn more about our students', 'promote cooperation with our university', 'build closer ties with us']
};

// 7 个步骤的详细数据
const stepsData = [
  {
    id: 's1', title: '介绍自己',
    note: '题目只给“你是李明”时，根据收信人身份选择对应句式。',
    items: [
      { tag: '组织者', html: 'I am Li Ming, a student from <mark>____</mark> and one of the organizers of this activity.' },
      { tag: '邀请老师', html: 'I am Li Ming, a student representative from <mark>____</mark>.' },
      { tag: '负责人', html: 'I am Li Ming, <mark>____</mark> of <mark>____</mark>.' },
      { tag: '示例', html: 'I am Li Ming, chairman of the Student Union.' },
      { tag: '示例', html: 'I am Li Ming, a graduate student from the School of Foreign Languages.' }
    ]
  },
  {
    id: 's2', title: '写信目的 + 活动信息',
    note: '这里有两个地方可以“拼图”：填入活动类型、填入时间地点。',
    items: [
      { tag: '目的', html: 'It is my great pleasure to invite you to our annual forum.' },
      { tag: '目的', html: 'On behalf of the Student Union, I would like to invite you to deliver a lecture.' },
      { 
        tag: '合并句', 
        isSlot: true, 
        poolType: ['活动类型 (Sec 2)', '时间地点 (Sec 2)'],
        html: '..., an activity themed <span class="blank-slot" data-slot-id="type_slot">填入活动类型</span>, which will be held <span class="blank-slot" data-slot-id="loc_slot">填入时间地点</span>.' 
      }
    ]
  },
  {
    id: 's3', title: '活动对收信人的好处',
    note: '将第8部分的具体动词短语装进好处句式。',
    items: [
      { 
        tag: '好处', 
        isSlot: true, 
        poolType: ['学术交流 (Sec 8)', '指导点评 (Sec 8)', '社交拓展 (Sec 8)', '放松娱乐 (Sec 8)', '展示分享 (Sec 8)', '了解合作 (Sec 8)'],
        html: 'The activity will <strong>provide you with a good opportunity</strong> to <span class="blank-slot" data-slot-id="slot1">选择素材</span>.' 
      },
      { 
        tag: '好处', 
        isSlot: true, 
        poolType: ['学术交流 (Sec 8)', '指导点评 (Sec 8)', '社交拓展 (Sec 8)', '放松娱乐 (Sec 8)', '展示分享 (Sec 8)', '了解合作 (Sec 8)'],
        html: 'The activity will <strong>enable you</strong> to <span class="blank-slot" data-slot-id="slot2">选择素材</span>.' 
      },
      { 
        tag: '好处', 
        isSlot: true, 
        poolType: ['学术交流 (Sec 8)', '指导点评 (Sec 8)', '社交拓展 (Sec 8)', '放松娱乐 (Sec 8)', '展示分享 (Sec 8)', '了解合作 (Sec 8)'],
        html: 'The activity will <strong>be a good chance for you</strong> to <span class="blank-slot" data-slot-id="slot3">选择素材</span>.' 
      },
      { tag: '完整句', html: 'Your participation will be <strong>of great benefit</strong> to our students.' }
    ]
  },
  {
    id: 's4', title: '适度恭维收信人',
    note: '一两句即可，表达对专家的尊重。',
    items: [
      { tag: '恭维', html: 'As <mark>an expert in this field</mark>, you are widely respected by our students.' },
      { tag: '恭维', html: 'With <mark>your rich experience in this area</mark>, you would be a most welcome guest.' },
      { tag: '恭维', html: '<mark>As a highly respected scholar</mark>, ...' },
      { tag: '恭维', html: '<mark>Your presence</mark> would be greatly appreciated.' }
    ]
  },
  {
    id: 's5', title: '明确请求 + 截止时间',
    note: '请求要具体（出席/发言/准备/回复），时间明确。',
    items: [
      { tag: '完整句', html: 'We would be grateful if you could <strong>confirm your attendance</strong> before <mark>June 10th</mark>.' },
      { tag: '完整句', html: 'Please <strong>let us know whether you can come</strong> by <mark>June 10th</mark>.' },
      { tag: '动作库', html: '只邀请出席: confirm your attendance before June 10th' },
      { tag: '动作库', html: '请对方发言: give a short speech at the activity' },
      { tag: '动作库', html: '请对方准备: prepare a brief introduction to...' }
    ]
  },
  {
    id: 's6', title: '客套话',
    note: '收尾礼节。',
    items: [
      { tag: '客套', html: 'Should you have any questions, please do not hesitate to contact me.' },
      { tag: '客套', html: 'We look forward to welcoming you to our university.' },
      { tag: '客套', html: 'Thank you for your time and consideration.' },
      { tag: '客套', html: 'We would appreciate your kind reply.' },
      { tag: '客套', html: 'Thank you in advance for your support.' }
    ]
  },
  {
    id: 's7', title: '期待回复',
    note: '结尾句。',
    items: [
      { tag: '结尾', html: 'Looking forward to your reply.' },
      { tag: '结尾', html: 'We look forward to hearing from you soon.' }
    ]
  }
];

// ---------- 逻辑篇 ----------

let favorites = JSON.parse(localStorage.getItem('invitation_favs')) || {};

function saveFavs() {
  localStorage.setItem('invitation_favs', JSON.stringify(favorites));
  applyFilter();
}

function toggleStar(id) {
  if (favorites[id]) delete favorites[id];
  else favorites[id] = true;
  saveFavs();
  renderSteps();
  renderBank();
}

// 渲染步骤
function renderSteps() {
  const container = document.getElementById('stepsContainer');
  container.innerHTML = stepsData.map(step => `
    <details ${step.id === 's2' || step.id === 's3' ? 'open' : ''}>
      <summary><span class="badge">${step.id.slice(1)}</span> ${step.title}</summary>
      <div class="content">
        <p class="note">${step.note}</p>
        ${step.items.map((item, idx) => {
          const itemId = `${step.id}_${idx}`;
          const isStarred = favorites[itemId];
          
          // 生成素材池
          let poolHTML = '';
          if (item.isSlot) {
            let poolContent = '';
            item.poolType.forEach(cat => {
              const phrases = materialBank[cat] || [];
              if(phrases.length > 0) {
                poolContent += `
                  <div class="pill-group">
                    <span class="pill-label">${cat}</span>
                    ${phrases.map(p => `<span class="pill" onclick="insertPhrase('${itemId}', '${p}', event)">${p}</span>`).join('')}
                  </div>
                `;
              }
            });

            poolHTML = `
              <div class="phrase-pool" id="pool-${itemId}">
                <div class="pool-title">
                  <span>选择素材填入 (选错可点重置)</span>
                  <span class="pool-close" onclick="resetSlot('${itemId}', event)">重置该句</span>
                </div>
                ${poolContent}
              </div>
            `;
          }

          return `
            <div class="item ${item.isSlot ? 'interactive-item' : ''}" data-id="${itemId}" id="item-${itemId}">
              <span class="tag">${item.tag}</span>
              <span class="en" id="en-${itemId}">${item.html}</span>
              <button class="star-btn ${isStarred ? 'active' : ''}" onclick="toggleStar('${itemId}')">${isStarred ? '★' : '☆'}</button>
            </div>
            ${poolHTML}
          `;
        }).join('')}
      </div>
    </details>
  `).join('');
  
  // 绑定槽位点击
  document.querySelectorAll('.blank-slot').forEach(slot => {
    slot.addEventListener('click', function(e) {
      e.stopPropagation();
      const itemEl = this.closest('.item');
      const poolId = 'pool-' + itemEl.dataset.id;
      document.querySelectorAll('.phrase-pool').forEach(p => { if(p.id !== poolId) p.classList.remove('show') });
      document.getElementById(poolId).classList.toggle('show');
    });
  });
  
  applyFilter();
}

// 插入素材
window.insertPhrase = function(itemId, phrase, event) {
  if(event) event.stopPropagation();
  // 找到当前已经高亮的槽位，或者第一个未填的槽位
  const itemEl = document.getElementById('item-' + itemId);
  const slots = itemEl.querySelectorAll('.blank-slot');
  
  // 简单策略：找第一个没有 has-value 类的槽位；如果都有，就填第一个
  let targetSlot = Array.from(slots).find(s => !s.classList.contains('has-value'));
  if (!targetSlot) targetSlot = slots[0]; 

  targetSlot.textContent = phrase;
  targetSlot.classList.add('has-value');
  
  // 如果所有槽位都填满了，就关闭面板
  if (Array.from(slots).every(s => s.classList.contains('has-value'))) {
    document.getElementById('pool-' + itemId).classList.remove('show');
  }
}

// 重置句子（清空所有槽位）
window.resetSlot = function(itemId, event) {
  if(event) event.stopPropagation();
  const itemEl = document.getElementById('item-' + itemId);
  const slots = itemEl.querySelectorAll('.blank-slot');
  slots.forEach(s => {
    s.textContent = s.getAttribute('data-default') || '选择素材';
    s.classList.remove('has-value');
  });
  document.getElementById('pool-' + itemId).classList.remove('show');
}

// 保存槽位默认文本
document.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    document.querySelectorAll('.blank-slot').forEach(s => {
      s.setAttribute('data-default', s.textContent.trim());
    });
  }, 100);
});

// 渲染第8部分素材库
function renderBank() {
  const grid = document.getElementById('bankGrid');
  // 过滤掉属于第2部分的活动类型和时间地点
  const bankKeys = Object.keys(materialBank).filter(k => k.includes('Sec 8'));
  
  grid.innerHTML = bankKeys.map((cat, tIdx) => `
    <div class="type-box">
      <h3>${cat.replace(' (Sec 8)', '')}</h3>
      ${materialBank[cat].map((phrase, pIdx) => {
        const itemId = `bank_${tIdx}_${pIdx}`;
        const isStarred = favorites[itemId];
        return `
          <div class="phrase-item" data-id="${itemId}">
            <div style="flex:1;">
              <span class="en">${phrase}</span>
            </div>
            <div style="display:flex; align-items:center;">
              <button class="btn-use" onclick="useInStep3('${phrase}')">套用</button>
              <button class="star-btn ${isStarred ? 'active' : ''}" onclick="toggleStar('${itemId}')">${isStarred ? '★' : '☆'}</button>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `).join('');
  applyFilter();
}

// 快捷套用到第3部分
window.useInStep3 = function(phrase) {
  const itemId = 's3_0'; // 默认填入第一句好处
  const itemEl = document.getElementById('item-' + itemId);
  const slot = itemEl.querySelector('.blank-slot');
  slot.textContent = phrase;
  slot.classList.add('has-value');
  
  // 展开并滚动
  const details = document.getElementById('step-s3').closest('details');
  details.open = true;
  document.getElementById('step-s3').scrollIntoView({ behavior: 'smooth', block: 'center' });
  
  // 闪烁反馈
  itemEl.style.transition = 'background 0.3s';
  itemEl.style.background = '#fff3c4';
  setTimeout(() => { itemEl.style.background = ''; }, 800);
}

// 收藏过滤逻辑
function applyFilter() {
  const showOnlyFav = document.getElementById('favToggle').checked;
  const items = document.querySelectorAll('.item, .phrase-item');
  
  items.forEach(el => {
    const id = el.getAttribute('data-id');
    if (showOnlyFav && !favorites[id]) el.classList.add('is-hidden');
    else el.classList.remove('is-hidden');
  });
  
  document.querySelectorAll('details').forEach(details => {
    if (showOnlyFav) {
      const hasVisible = details.querySelector('.item:not(.is-hidden), .phrase-item:not(.is-hidden)');
      details.open = !!hasVisible;
    }
  });
}

document.getElementById('favToggle').addEventListener('change', applyFilter);

// 启动
renderSteps();
renderBank();
</script>
</body>
</html>
