<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>邀请信写作 · 复习手册</title>
<style>
  :root{
    --bg:#f7f6f2; --card:#fff; --ink:#1a1c1b; --muted:#6b6d68;
    --line:#e5e3db; --accent:#0d6e6e; --soft:#e6f2f2;
    --highlight:#fff3c4; --highlight-ink:#8a5a00;
    --star:#f59e0b; --star-gray:#d1d5db;
    --blur-amt: 4px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink); line-height:1.65;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  .wrap{max-width:800px; margin:0 auto; padding:0 20px}
  
  /* 顶部 */
  .hero{padding:40px 0 20px}
  .hero h1{font-size:26px; margin:0 0 8px}
  .hero p{margin:0; color:var(--muted); font-size:14px}
  .hero mark { background: var(--highlight); color: var(--highlight-ink); padding: 2px 6px; border-radius: 4px; border: 1px dashed var(--highlight-ink); font-weight: 600;}
  .hero strong { color: var(--accent); }
  
  /* 工具栏 */
  .toolbar{
    display:flex; flex-wrap:wrap; gap:16px;
    padding:14px 0; border-bottom:1px solid var(--line); margin-bottom:20px;
  }
  .toggle-wrap{display:flex; align-items:center; gap:8px; cursor:pointer; font-size:14px; color:var(--muted)}
  .toggle-wrap input{accent-color:var(--accent); width:16px; height:16px; margin:0}

  /* 步骤卡片 */
  details{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    margin-bottom:12px; overflow:hidden; transition:border-color .2s;
  }
  details[open]{border-color:#b0ccca; box-shadow:0 2px 8px rgba(0,0,0,.02)}
  summary{
    padding:16px 20px; cursor:pointer; list-style:none; display:flex; align-items:center;
    font-weight:600; font-size:16px; user-select:none;
  }
  summary::-webkit-details-marker{display:none}
  summary:before{
    content:'+'; font-size:18px; color:var(--accent); margin-right:12px; font-weight:700;
    transition:transform .2s;
  }
  details[open] summary:before{content:'−'; transform:rotate(180deg)}
  .badge{
    font-size:12px; color:var(--accent); background:var(--soft);
    padding:2px 8px; border-radius:6px; margin-right:12px;
  }
  
  .content{padding:0 20px 20px 20px; border-top:1px solid var(--line); padding-top:16px}
  .note{font-size:13.5px; color:var(--muted); margin:0 0 16px}
  
  /* 句子块 */
  .sentence-block {
    margin-bottom: 12px; padding: 12px; border-radius: 8px;
    background: #faf9f6; border: 1px solid transparent; transition: background .15s;
  }
  .sentence-block:hover { background: #fff; border-color: var(--line); }
  
  .sentence-head { display: flex; gap: 12px; align-items: flex-start; }
  
  .sentence-text {
    flex: 1; font-family: ui-serif,Georgia,"Times New Roman",serif;
    font-size: 15.5px; color: #22303a; line-height: 2.2; word-break: break-word;
    transition: filter .2s;
  }
  .sentence-text strong { color: var(--accent); font-weight: 700; }

  /* 模糊自测逻辑 */
  body.masked .sentence-text { filter: blur(var(--blur-amt)); cursor: help; }
  body.masked .sentence-text:hover, body.masked .sentence-text.revealed { filter: none; cursor: text; }

  /* 变量显示区 (纯文本显示，不放下拉框) */
  .var-display {
    display: inline-block;
    min-width: 70px;
    background: var(--highlight);
    color: var(--highlight-ink);
    border: 1.5px dashed var(--highlight-ink);
    border-radius: 4px;
    padding: 0 6px;
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 600;
    text-align: center;
    transition: all .2s;
    vertical-align: baseline;
  }
  .var-display.has-value {
    border-style: solid;
    background: #fff7db;
    color: var(--accent);
  }

  /* 单独放置的操作按钮 */
  .action-row {
    margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap;
  }
  .action-btn {
    background: #fff; border: 1px dashed var(--accent); color: var(--accent);
    border-radius: 4px; padding: 4px 10px; font-size: 12px; cursor: pointer;
    transition: .2s; font-family: inherit; font-weight: 600;
  }
  .action-btn:hover { background: var(--accent); color: #fff; border-style: solid; }

  /* 弹出药丸面板 */
  .phrase-pool {
    margin-top: 12px; padding: 14px; background: #f4f8f8;
    border-radius: 8px; border: 1px solid #d0e3e1;
    display: none; 
  }
  .phrase-pool.show { display: block; animation: fadeIn .2s; }
  @keyframes fadeIn { from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:translateY(0);} }
  
  .pool-title { 
    font-size: 12px; color: var(--muted); margin-bottom: 10px; 
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid #d0e3e1; padding-bottom: 6px;
  }
  .pool-close { cursor: pointer; color: var(--accent); font-size: 12px; border: 1px solid var(--accent); padding: 2px 8px; border-radius: 4px; }
  .pool-close:hover { background: var(--accent); color: #fff; }
  
  .pill-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .pill-group:last-child { margin-bottom: 0; }
  .pill-label { font-size: 12px; color: var(--muted); width: 100%; margin-bottom: -2px; font-weight: bold;}
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; background: #fff; border: 1px solid #c5d8d7; padding: 4px 10px;
    border-radius: 99px; cursor: pointer; color: #14534f; transition: .15s;
    font-family: ui-serif,Georgia,serif;
  }
  .pill:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  
  /* 自定义删除小叉 */
  .pill-del {
    color: #999; font-size: 14px; font-weight: bold; line-height: 1;
    padding: 0 4px; border-radius: 50%;
  }
  .pill-del:hover { color: #d32f2f; background: rgba(0,0,0,0.1); }

  /* 自定义输入表单 */
  .custom-form {
    display: flex; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed #d0e3e1;
  }
  .custom-input {
    flex: 1; border: 1px solid #c5d8d7; border-radius: 6px; padding: 6px 10px;
    font-size: 13px; font-family: inherit; outline: none; transition: border .2s;
  }
  .custom-input:focus { border-color: var(--accent); }
  .custom-btn {
    background: var(--accent); color: #fff; border: none; border-radius: 6px;
    padding: 0 14px; cursor: pointer; font-size: 13px; transition: background .2s;
  }
  .custom-btn:hover { background: #0a5555; }

  /* 标签与收藏 */
  .tag{
    flex:0 0 auto; font-size:12px; color:var(--muted); background:#eae8e3;
    padding:2px 8px; border-radius:4px; margin-top:6px; white-space:nowrap;
  }
  .star-btn{
    background:none; border:none; cursor:pointer; font-size:20px;
    color:var(--star-gray); padding:0; margin-top:4px; transition:.15s; outline:none;
  }
  .star-btn:hover, .star-btn.active{color:var(--star)}

  /* 笔记区域 */
  .note-area {
    margin-top: 20px; padding-top: 16px; border-top: 1px dashed var(--line);
  }
  .note-label {
    font-size: 13px; font-weight: 600; color: var(--accent);
    margin-bottom: 8px; display: flex; align-items: center; gap: 4px;
  }
  .custom-note {
    width: 100%; min-height: 80px; padding: 10px;
    border: 1px solid #c5d8d7; border-radius: 6px;
    font-family: inherit; font-size: 13.5px; line-height: 1.5;
    resize: vertical; outline: none; transition: border .2s; background: #faf9f6;
  }
  .custom-note:focus { border-color: var(--accent); background: #fff; }
  
  /* 第8部分素材库 */
  .grid{display:grid; gap:12px; grid-template-columns:1fr; margin-top:10px}
  .type-box{background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px}
  .type-box h3{margin:0 0 10px; font-size:15px; color:var(--accent); display:flex; align-items:center; justify-content:space-between}
  .meta{font-size:13px; color:var(--muted); margin-bottom:8px}
  
  .phrase-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 10px; border-radius:6px; background:#faf9f6; margin-bottom:6px;
  }
  .phrase-item .en{font-size:14.5px; color:var(--accent); font-weight:700; line-height:1.4;}

  .is-hidden { display:none !important; }
</style>
</head>
<body>

<div class="wrap">
  <div class="hero">
    <h1>邀请信写作 · 复习手册</h1>
    <p>
      <mark>[括号内]</mark>为需替换词汇，点击句子下方的按钮即可替换；<br>
      <strong>青色加粗</strong>为背诵时要抓住的核心动词搭配。
    </p>
  </div>

  <div class="toolbar">
    <label class="toggle-wrap">
      <input type="checkbox" id="favToggle">
      <span>只看我收藏的句子</span>
    </label>
    <label class="toggle-wrap">
      <input type="checkbox" id="maskToggle">
      <span>开启模糊自测 (悬浮或点击清晰)</span>
    </label>
  </div>

  <div id="stepsContainer"></div>
  
  <div style="margin-top:30px">
    <details>
      <summary><span class="badge">08</span> 分类素材库</summary>
      <div class="content">
        <p class="note">核心短语库，可直接复习或收藏。</p>
        <div class="grid" id="bankGrid"></div>
        <div class="note-area">
          <div class="note-label">📝 我的笔记</div>
          <textarea class="custom-note" data-id="step-s8" placeholder="在此记录背诵技巧、易错点..."></textarea>
        </div>
      </div>
    </details>
  </div>
</div>

<script>
// 默认基础素材
const defaultBank = {
  '学术交流类': ['exchange ideas with other scholars', 'share your research findings', 'learn about the latest developments in the field', 'meet other experts'],
  '指导点评类': ['offer guidance to young students', 'comment on their performances', 'discover talented students'],
  '社交拓展类': ['make new friends', 'meet people with similar interests', 'communicate with our students and teachers'],
  '放松娱乐类': ['relax and enjoy yourself', 'enjoy wonderful performances', 'spend a pleasant evening with us'],
  '展示分享类': ['share your valuable experience', 'present your ideas', 'show your talent'],
  '了解合作类': ['learn more about our students', 'promote cooperation with our university', 'build closer ties with us']
};

const defaultPool = {
  'activity': ['an English speech contest', 'an academic lecture', 'a cultural exchange activity', 'a graduation ceremony', 'a campus seminar'],
  'location': ['in the school auditorium at 2 p.m. on June 15th', 'in Meeting Room 201 at 3 p.m. next Friday', 'in the conference hall on the morning of June 20th'],
  'action': ['confirm your attendance', 'give a short speech at the activity', 'prepare a brief introduction to...'],
  'deadline': ['June 10th', 'next Friday'],
  'department': ['the School of Foreign Languages', 'the School of Economics'],
  'role': ['chairman', 'president'],
  'organization': ['the Student Union', 'the Organizing Committee', 'the Class Committee']
};

let customPoolData = JSON.parse(localStorage.getItem('custom_pool_data')) || {};
let notesData = JSON.parse(localStorage.getItem('invitation_notes')) || {};
let favorites = JSON.parse(localStorage.getItem('invitation_favs')) || {};

function saveCustomData() { localStorage.setItem('custom_pool_data', JSON.stringify(customPoolData)); }

// 生成面板 HTML
function getPoolHTML(type) {
  let title = '选择素材';
  let groups = [];
  
  if (type === 'activity') {
    title = '活动类型'; groups = [{ name: '可选活动', items: defaultPool.activity }];
  } else if (type === 'location') {
    title = '时间地点'; groups = [{ name: '可选时间地点', items: defaultPool.location }];
  } else if (type === 'benefit') {
    title = '好处素材库 (结合第8部分)';
    groups = Object.entries(defaultBank).map(([k, v]) => ({ name: k, items: v }));
  } else if (type === 'action') {
    title = '请求动作'; groups = [{ name: '具体动作', items: defaultPool.action }];
  } else if (type === 'deadline') {
    title = '截止时间'; groups = [{ name: '时间', items: defaultPool.deadline }];
  } else if (type === 'department') {
    title = '院系'; groups = [{ name: '院系', items: defaultPool.department }];
  } else if (type === 'role') {
    title = '职务'; groups = [{ name: '职务', items: defaultPool.role }];
  } else if (type === 'organization') {
    title = '组织'; groups = [{ name: '组织', items: defaultPool.organization }];
  }

  if (customPoolData[type] && customPoolData[type].length > 0) {
    groups.push({ name: '自定义补充', items: customPoolData[type], isCustom: true });
  }

  let html = `<div class="pool-title"><span>${title}</span><span class="pool-close">关闭</span></div>`;
  
  groups.forEach(g => {
    html += `<div class="pill-group"><span class="pill-label">${g.name}</span>`;
    g.items.forEach(item => {
      const safeVal = item.replace(/"/g, '&quot;');
      const delBtn = g.isCustom ? `<span class="pill-del" data-type="${type}" data-val="${safeVal}">×</span>` : '';
      html += `<span class="pill" data-value="${safeVal}">${item} ${delBtn}</span>`;
    });
    html += `</div>`;
  });

  html += `
    <form class="custom-form" data-type="${type}">
      <input type="text" class="custom-input" placeholder="输入想要补充的短语..." required>
      <button type="submit" class="custom-btn">添加</button>
    </form>
  `;

  return html;
}

const stepsData = [
  {
    id: 's1', title: '介绍自己',
    note: '根据收信人身份，选择对应句式。点击下方按钮替换空白处。',
    items: [
      { 
        tag: '组织者', 
        text: 'I am Li Ming, a student from <span class="var-display" data-slot="var-dept1">[院系]</span> and <strong>one of the organizers</strong> of this activity.',
        actions: [{ label: '选择院系', target: 'var-dept1', type: 'department' }]
      },
      { 
        tag: '邀请老师', 
        text: 'I am Li Ming, a <strong>student representative</strong> from <span class="var-display" data-slot="var-dept2">[院系]</span>.',
        actions: [{ label: '选择院系', target: 'var-dept2', type: 'department' }]
      },
      { 
        tag: '负责人', 
        text: 'I am Li Ming, <span class="var-display" data-slot="var-role">[职务]</span> of <span class="var-display" data-slot="var-org">[组织]</span>.',
        actions: [
          { label: '选择职务', target: 'var-role', type: 'role' },
          { label: '选择组织', target: 'var-org', type: 'organization' }
        ]
      },
      { tag: '示例', text: 'I am Li Ming, <strong>chairman of the Student Union</strong>.' },
      { tag: '示例', text: 'I am Li Ming, a <strong>graduate student</strong> from the School of Foreign Languages.' }
    ]
  },
  {
    id: 's2', title: '写信目的 + 活动信息',
    note: '合并句式填空：原句不放下拉框，点击下方对应按钮选择即可。',
    items: [
      { tag: '目的', text: 'It is my great pleasure to <strong>invite you to our annual forum</strong>.' },
      { tag: '目的', text: 'On behalf of the Student Union, I would like to <strong>invite you to deliver a lecture</strong>.' },
      { 
        tag: '合并句', 
        text: '..., an activity themed <span class="var-display" data-slot="var-act">[活动类型]</span>, which <strong>will be held</strong> <span class="var-display" data-slot="var-loc">[时间地点]</span>.',
        actions: [
          { label: '选择活动类型', target: 'var-act', type: 'activity' },
          { label: '选择时间地点', target: 'var-loc', type: 'location' }
        ]
      }
    ]
  },
  {
    id: 's3', title: '活动对收信人的好处',
    note: '点击下方按钮，从第 8 部分的素材库中选择短语填入。',
    items: [
      { 
        tag: '好处', 
        text: 'The activity will <strong>provide you with a good opportunity</strong> to <span class="var-display" data-slot="var-b1">[选择动词短语]</span>.',
        actions: [{ label: '选择动词短语', target: 'var-b1', type: 'benefit' }]
      },
      { 
        tag: '好处', 
        text: 'The activity will <strong>enable you</strong> to <span class="var-display" data-slot="var-b2">[选择动词短语]</span>.',
        actions: [{ label: '选择动词短语', target: 'var-b2', type: 'benefit' }]
      },
      { 
        tag: '好处', 
        text: 'The activity will <strong>be a good chance for you</strong> to <span class="var-display" data-slot="var-b3">[选择动词短语]</span>.',
        actions: [{ label: '选择动词短语', target: 'var-b3', type: 'benefit' }]
      },
      { tag: '完整句', text: 'Your participation will <strong>be of great benefit</strong> to our students.' }
    ]
  },
  {
    id: 's4', title: '适度恭维收信人',
    note: '一两句即可，把握核心赞美词。',
    items: [
      { tag: '恭维', text: 'As <strong>an expert in this field</strong>, you are <strong>widely respected by our students</strong>.' },
      { tag: '恭维', text: 'With <strong>your rich experience in this area</strong>, <strong>you would be a most welcome guest</strong>.' },
      { tag: '恭维', text: 'As <strong>a highly respected scholar</strong>, ...' },
      { tag: '恭维', text: '<strong>Your presence would be greatly appreciated</strong>.' }
    ]
  },
  {
    id: 's5', title: '明确请求 + 截止时间',
    note: '具体动作和截止时间均可点击下方按钮替换。',
    items: [
      { 
        tag: '完整句', 
        text: '<strong>We would be grateful if you could</strong> <span class="var-display" data-slot="var-act1">[动作]</span> before <span class="var-display" data-slot="var-time1">[时间]</span>.',
        actions: [
          { label: '选择动作', target: 'var-act1', type: 'action' },
          { label: '选择时间', target: 'var-time1', type: 'deadline' }
        ]
      },
      { 
        tag: '完整句', 
        text: 'Please <strong>let us know whether you can come</strong> by <span class="var-display" data-slot="var-time2">[时间]</span>.',
        actions: [{ label: '选择时间', target: 'var-time2', type: 'deadline' }]
      }
    ]
  },
  {
    id: 's6', title: '客套话',
    note: '收尾礼节。',
    items: [
      { tag: '客套', text: 'Should you have any questions, please <strong>do not hesitate to contact me</strong>.' },
      { tag: '客套', text: 'We <strong>look forward to welcoming you</strong> to our university.' },
      { tag: '客套', text: 'Thank you for your time and consideration.' },
      { tag: '客套', text: 'We would appreciate your kind reply.' },
      { tag: '客套', text: 'Thank you in advance for your support.' }
    ]
  },
  {
    id: 's7', title: '期待回复',
    note: '结尾固定收束句。',
    items: [
      { tag: '结尾', text: '<strong>Looking forward to</strong> your reply.' },
      { tag: '结尾', text: 'We <strong>look forward to hearing from you</strong> soon.' }
    ]
  }
];

// 渲染步骤
function renderSteps() {
  const container = document.getElementById('stepsContainer');
  container.innerHTML = stepsData.map(step => `
    <details ${step.id === 's2' || step.id === 's3' ? 'open' : ''}>
      <summary><span class="badge">${step.id.slice(1)}</span> ${step.title}</summary>
      <div class="content">
        <p class="note">${step.note}</p>
        
        ${step.items.map((item, idx) => {
          const itemId = `${step.id}_${idx}`;
          const isStarred = favorites[itemId] ? 'active' : '';
          const starChar = favorites[itemId] ? '★' : '☆';
          const hasActions = item.actions && item.actions.length > 0;
          
          // 给带有 data-slot 的 span 加上唯一 id (防止冲突)
          let formattedText = item.text;
          if (hasActions) {
            formattedText = formattedText.replace(/data-slot="([^"]+)"/g, `data-slot="$1" id="${itemId}-$1"`);
          }

          let actionsHTML = '';
          if (hasActions) {
            actionsHTML = `<div class="action-row">
              ${item.actions.map(act => `
                <button class="action-btn" data-item="${itemId}" data-target="${itemId}-${act.target}" data-type="${act.type}">
                  ${act.label} ▼
                </button>
              `).join('')}
            </div>`;
          }

          return `
            <div class="sentence-block" id="block-${itemId}">
              <div class="sentence-head">
                <span class="tag">${item.tag}</span>
                <span class="sentence-text" onclick="toggleReveal(this)">${formattedText}</span>
                <button class="star-btn ${isStarred}" data-id="${itemId}">${starChar}</button>
              </div>
              ${actionsHTML}
            </div>
          `;
        }).join('')}

        <!-- 笔记区域 -->
        <div class="note-area">
          <div class="note-label">📝 我的笔记</div>
          <textarea class="custom-note" data-id="${step.id}" placeholder="在此记录背诵技巧、易错点或补充素材...">${notesData[step.id] || ''}</textarea>
        </div>
      </div>
    </details>
  `).join('');
  applyFilter();
}

// 渲染素材库
function renderBank() {
  const grid = document.getElementById('bankGrid');
  grid.innerHTML = Object.entries(defaultBank).map(([cat, phrases], tIdx) => `
    <div class="type-box">
      <h3>${cat}</h3>
      ${phrases.map((phrase, pIdx) => {
        const itemId = `bank_${tIdx}_${pIdx}`;
        const isStarred = favorites[itemId] ? 'active' : '';
        const starChar = favorites[itemId] ? '★' : '☆';
        return `
          <div class="phrase-item" id="item-${itemId}">
            <div style="flex:1;">
              <span class="sentence-text" style="line-height:1.4;" onclick="toggleReveal(this)">${phrase}</span>
            </div>
            <button class="star-btn ${isStarred}" data-id="${itemId}">${starChar}</button>
          </div>
        `;
      }).join('')}
    </div>
  `).join('');
  applyFilter();
}

window.toggleReveal = function(el) {
  if (document.body.classList.contains('masked')) {
    el.classList.toggle('revealed');
  }
};

document.addEventListener('click', function(e) {
  // 1. 收藏
  const starBtn = e.target.closest('.star-btn');
  if (starBtn) {
    const id = starBtn.dataset.id;
    if (favorites[id]) {
      delete favorites[id];
      starBtn.classList.remove('active');
      starBtn.textContent = '☆';
    } else {
      favorites[id] = true;
      starBtn.classList.add('active');
      starBtn.textContent = '★';
    }
    localStorage.setItem('invitation_favs', JSON.stringify(favorites));
    if (document.getElementById('favToggle').checked) applyFilter();
    return;
  }

  // 2. 点击操作按钮展开/折叠面板
  const actionBtn = e.target.closest('.action-btn');
  if (actionBtn) {
    e.stopPropagation();
    const itemId = actionBtn.dataset.item;
    const targetId = actionBtn.dataset.target;
    const type = actionBtn.dataset.type;
    const block = document.getElementById(`block-${itemId}`);
    
    let pool = block.querySelector('.phrase-pool');
    
    // 如果已经展开且类型相同，则收起
    if (pool && pool.classList.contains('show') && pool.dataset.type === type) {
      pool.classList.remove('show');
      return;
    }

    // 关闭其他面板
    document.querySelectorAll('.phrase-pool').forEach(p => p.classList.remove('show'));
    
    // 创建或更新面板
    if (!pool) {
      pool = document.createElement('div');
      pool.className = 'phrase-pool';
      block.appendChild(pool);
    }
    
    pool.dataset.type = type;
    pool.dataset.target = targetId;
    pool.innerHTML = getPoolHTML(type);
    pool.classList.add('show');
    return;
  }

  // 3. 点击药丸选项填入变量框
  const pill = e.target.closest('.pill');
  if (pill && !e.target.classList.contains('pill-del')) {
    e.stopPropagation();
    const val = pill.getAttribute('data-value');
    const pool = pill.closest('.phrase-pool');
    const targetId = pool.dataset.target;
    const targetEl = document.getElementById(targetId);
    
    if (targetEl) {
      targetEl.textContent = val;
      targetEl.classList.add('has-value');
    }
    pool.classList.remove('show');
    return;
  }

  // 4. 删除自定义词条
  const delBtn = e.target.closest('.pill-del');
  if (delBtn) {
    e.stopPropagation();
    const type = delBtn.dataset.type;
    const val = delBtn.dataset.val;
    if (customPoolData[type]) {
      customPoolData[type] = customPoolData[type].filter(item => item !== val);
      if (customPoolData[type].length === 0) delete customPoolData[type];
      saveCustomData();
      
      // 重新渲染当前面板
      const pool = delBtn.closest('.phrase-pool');
      pool.innerHTML = getPoolHTML(type);
    }
    return;
  }

  // 5. 关闭面板
  if (e.target.classList.contains('pool-close')) {
    e.stopPropagation();
    e.target.closest('.phrase-pool').classList.remove('show');
    return;
  }

  // 6. 点击外部关闭所有面板
  if (!e.target.closest('.phrase-pool') && !e.target.closest('.action-btn')) {
    document.querySelectorAll('.phrase-pool').forEach(p => p.classList.remove('show'));
  }
});

// 监听表单提交 (添加自定义素材)
document.addEventListener('submit', function(e) {
  if (e.target.classList.contains('custom-form')) {
    e.preventDefault();
    const form = e.target;
    const type = form.getAttribute('data-type');
    const input = form.querySelector('.custom-input');
    const val = input.value.trim();
    const pool = form.closest('.phrase-pool');
    
    if (val) {
      if (!customPoolData[type]) customPoolData[type] = [];
      if (!customPoolData[type].includes(val) && !(defaultPool[type] && defaultPool[type].includes(val))) {
        customPoolData[type].push(val);
        saveCustomData();
      }
      pool.innerHTML = getPoolHTML(type);
    }
  }
});

// 监听笔记输入并保存
document.addEventListener('input', function(e) {
  if (e.target.classList.contains('custom-note')) {
    const id = e.target.getAttribute('data-id');
    notesData[id] = e.target.value;
    localStorage.setItem('invitation_notes', JSON.stringify(notesData));
  }
});

document.getElementById('maskToggle').addEventListener('change', function(e) {
  document.body.classList.toggle('masked', e.target.checked);
  if (!e.target.checked) {
    document.querySelectorAll('.revealed').forEach(el => el.classList.remove('revealed'));
  }
});

function applyFilter() {
  const showOnlyFav = document.getElementById('favToggle').checked;
  const items = document.querySelectorAll('.sentence-block, .phrase-item');
  
  items.forEach(el => {
    // 尝试获取对应 ID
    let id = '';
    if (el.classList.contains('sentence-block')) {
      id = el.id.replace('block-', '');
    } else {
      id = el.id.replace('item-', '');
    }
    
    if (showOnlyFav && !favorites[id]) el.classList.add('is-hidden');
    else el.classList.remove('is-hidden');
  });
  
  document.querySelectorAll('details').forEach(details => {
    if (showOnlyFav) {
      const hasVisible = details.querySelector('.sentence-block:not(.is-hidden), .phrase-item:not(.is-hidden)');
      details.open = !!hasVisible;
    }
  });
}

document.getElementById('favToggle').addEventListener('change', applyFilter);

renderSteps();
renderBank();
</script>
</body>
